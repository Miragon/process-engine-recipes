version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    labels:
      - 'dependencies'
    rebase-strategy: 'auto'
    commit-message:
      prefix: 'chore'
      include: 'scope'
    cooldown:
      default-days: 7
    groups:
      root-github-actions:
        applies-to: version-updates
        patterns: ['*']
      root-github-actions-security:
        applies-to: security-updates
        patterns: ['*']

  - package-ecosystem: 'maven'
    directory: '/recipes/camunda7/cockpit-sso'
    schedule:
      interval: 'monthly'
    labels:
      - 'dependencies'
      - 'recipe:camunda7-cockpit-sso'
    rebase-strategy: 'auto'
    commit-message:
      prefix: 'chore'
      include: 'scope'
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: 'org.springframework.boot:*'
        versions: ['>=4.0.0']
    groups:
      sso-maven:
        applies-to: version-updates
        patterns: ['*']
      sso-maven-security:
        applies-to: security-updates
        patterns: ['*']

  - package-ecosystem: 'docker-compose'
    directory: '/recipes/camunda7/cockpit-sso/sso-stack'
    schedule:
      interval: 'monthly'
    labels:
      - 'dependencies'
      - 'recipe:camunda7-cockpit-sso'
    rebase-strategy: 'auto'
    commit-message:
      prefix: 'chore'
      include: 'scope'
    cooldown:
      default-days: 7
    groups:
      sso-docker-compose:
        applies-to: version-updates
        patterns: ['*']
      sso-docker-compose-security:
        applies-to: security-updates
        patterns: ['*']

  - package-ecosystem: 'maven'
    directory: '/recipes/camunda8/external-tasklist'
    schedule:
      interval: 'monthly'
    labels:
      - 'dependencies'
      - 'recipe:camunda8-external-tasklist'
    rebase-strategy: 'auto'
    commit-message:
      prefix: 'chore'
      include: 'scope'
    cooldown:
      default-days: 7
    ignore:
      # A Camunda minor or major upgrade is a migration of the recipe, not a dependency bump.
      - dependency-name: 'io.camunda:*'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
    groups:
      tasklist-maven:
        applies-to: version-updates
        patterns: ['*']
      tasklist-maven-security:
        applies-to: security-updates
        patterns: ['*']

  - package-ecosystem: 'npm'
    directory: '/recipes/camunda8/external-tasklist/processes/order/frontend'
    schedule:
      interval: 'monthly'
    labels:
      - 'dependencies'
      - 'recipe:camunda8-external-tasklist'
    rebase-strategy: 'auto'
    commit-message:
      prefix: 'chore'
      include: 'scope'
    cooldown:
      default-days: 7
    ignore:
      # typescript-eslint has to support a TypeScript major first.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
    groups:
      tasklist-order-forms-npm:
        applies-to: version-updates
        patterns: ['*']
      tasklist-order-forms-npm-security:
        applies-to: security-updates
        patterns: ['*']

  - package-ecosystem: 'npm'
    directory: '/recipes/camunda8/external-tasklist/tasklist'
    schedule:
      interval: 'monthly'
    labels:
      - 'dependencies'
      - 'recipe:camunda8-external-tasklist'
    rebase-strategy: 'auto'
    commit-message:
      prefix: 'chore'
      include: 'scope'
    cooldown:
      default-days: 7
    ignore:
      # typescript-eslint has to support a TypeScript major first.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
    groups:
      tasklist-ui-npm:
        applies-to: version-updates
        patterns: ['*']
      tasklist-ui-npm-security:
        applies-to: security-updates
        patterns: ['*']

  - package-ecosystem: 'npm'
    directory: '/recipes/camunda8/external-tasklist/e2e'
    schedule:
      interval: 'monthly'
    labels:
      - 'dependencies'
      - 'recipe:camunda8-external-tasklist'
    rebase-strategy: 'auto'
    commit-message:
      prefix: 'chore'
      include: 'scope'
    cooldown:
      default-days: 7
    groups:
      tasklist-e2e-npm:
        applies-to: version-updates
        patterns: ['*']
      tasklist-e2e-npm-security:
        applies-to: security-updates
        patterns: ['*']

  - package-ecosystem: 'docker-compose'
    directory: '/recipes/camunda8/external-tasklist/stack'
    schedule:
      interval: 'monthly'
    labels:
      - 'dependencies'
      - 'recipe:camunda8-external-tasklist'
    rebase-strategy: 'auto'
    commit-message:
      prefix: 'chore'
      include: 'scope'
    cooldown:
      default-days: 7
    ignore:
      # A Camunda minor or major upgrade is a migration of the recipe, not a dependency bump.
      - dependency-name: 'camunda/camunda'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      # Camunda supports Elasticsearch 8.19+ and 9.4+; a new major needs Camunda's support first.
      - dependency-name: '*elasticsearch'
        update-types: ['version-update:semver-major']
      # The services run on the Java LTS the recipe states (25); moving to another Java is a decision, not a bump.
      - dependency-name: 'eclipse-temurin'
        update-types: ['version-update:semver-major']
    groups:
      tasklist-stack-docker-compose:
        applies-to: version-updates
        patterns: ['*']
      tasklist-stack-docker-compose-security:
        applies-to: security-updates
        patterns: ['*']

  - package-ecosystem: 'gradle'
    directory: '/recipes/cibseven/multi-engine-cockpit'
    schedule:
      interval: 'monthly'
    labels:
      - 'dependencies'
      - 'recipe:cibseven-multi-engine-cockpit'
    rebase-strategy: 'auto'
    commit-message:
      prefix: 'chore'
      include: 'scope'
    cooldown:
      default-days: 7
    groups:
      multi-engine-cockpit-gradle:
        applies-to: version-updates
        patterns: ['*']
      multi-engine-cockpit-gradle-security:
        applies-to: security-updates
        patterns: ['*']

  - package-ecosystem: 'docker-compose'
    directory: '/recipes/cibseven/multi-engine-cockpit/stack'
    schedule:
      interval: 'monthly'
    labels:
      - 'dependencies'
      - 'recipe:cibseven-multi-engine-cockpit'
    rebase-strategy: 'auto'
    commit-message:
      prefix: 'chore'
      include: 'scope'
    cooldown:
      default-days: 7
    ignore:
      # The services run on the Java LTS the recipe states (25); moving to another Java is a decision, not a bump.
      - dependency-name: 'eclipse-temurin'
        update-types: ['version-update:semver-major']
    groups:
      multi-engine-cockpit-docker-compose:
        applies-to: version-updates
        patterns: ['*']
      multi-engine-cockpit-docker-compose-security:
        applies-to: security-updates
        patterns: ['*']

  - package-ecosystem: 'npm'
    directory: '/recipes/cibseven/multi-engine-cockpit/e2e'
    schedule:
      interval: 'monthly'
    labels:
      - 'dependencies'
      - 'recipe:cibseven-multi-engine-cockpit'
    rebase-strategy: 'auto'
    commit-message:
      prefix: 'chore'
      include: 'scope'
    cooldown:
      default-days: 7
    groups:
      multi-engine-cockpit-npm:
        applies-to: version-updates
        patterns: ['*']
      multi-engine-cockpit-npm-security:
        applies-to: security-updates
        patterns: ['*']

  - package-ecosystem: 'gradle'
