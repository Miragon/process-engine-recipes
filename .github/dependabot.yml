  - package-ecosystem: 'maven'
    directory: '/recipes/cibseven/engine-plugin-history-events'
    schedule:
      interval: 'monthly'
    labels:
      - 'dependencies'
      - 'recipe:cibseven-engine-plugin-history-events'
