<form role="form" name="checkRepairQuality">
  <div class="form-group">
    <label for="frameNumber">Frame number</label>
    <input id="frameNumber" class="form-control" type="text" readonly
           cam-variable-name="frameNumber" cam-variable-type="String" />
  </div>
  <div class="form-group">
    <label>
      <input type="checkbox" cam-variable-name="brakesOk" cam-variable-type="Boolean" />
      Brakes work
    </label>
  </div>
  <div class="form-group">
    <label>
      <input type="checkbox" cam-variable-name="gearsOk" cam-variable-type="Boolean" />
      Gears shift cleanly
    </label>
  </div>
  <div class="form-group">
    <label>
      <input type="checkbox" cam-variable-name="testRideOk" cam-variable-type="Boolean" />
      Test ride done
    </label>
  </div>
</form>
