# The central tasklist on http://localhost:3000: the built app from tasklist/dist and the task manager API
# on the same origin, so the browser never talks to the process applications.

# A strict policy for the app: everything from its own origin, no inline scripts or styles, no plugins.
# Only the task manager's /api/forms/.../frame may be framed; it sets its own sandboxed policy.
map $request_uri $tasklist_csp {
    default "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src 'self'; frame-ancestors 'self'; base-uri 'none'; form-action 'none'";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # The task manager API. No headers are added here: the form frames under /api/forms/ keep the content
    # security policy of the task manager. The server-sent events of /api/events pass unbuffered and stay
    # open (the task manager sends a keep-alive every 20 s); completions wait for Camunda's listeners.
    location /api/ {
        proxy_pass http://taskmanager:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Files with a content hash in their name never change.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # The single-page app: every other path is the app, which reads its state from the query string.
    location / {
        add_header Content-Security-Policy $tasklist_csp always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header Cache-Control no-cache always;
        try_files $uri $uri/ /index.html;
    }
}
