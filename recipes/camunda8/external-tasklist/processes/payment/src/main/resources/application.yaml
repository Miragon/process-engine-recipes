server:
  port: 8082

spring:
  application:
    name: payment-app
  # The database of the compose stack, so the application also runs from the IDE.
  datasource:
    url: jdbc:postgresql://localhost:5432/payments
    username: payments
    password: payments

camunda:
  client:
    mode: self-managed
    rest-address: http://localhost:8080
    grpc-address: http://localhost:26500
    # Longer than the 15 s Camunda waits for user task listeners, so a slow completion comes back
    # as 504 (accepted, not yet confirmed) instead of a timeout on the client side.
    request-timeout: 20s
    auth:
      method: none

tasklist:
  provider:
    # The task manager sends this token; configure the same value there.
    token: payment-demo-token

payment:
  reminder-after: P3D
  overdue-after: P14D
  callback:
    allowed-hosts: localhost,order-app
    connect-timeout: 2s
    read-timeout: 10s
    retry-backoff: 5s

springdoc:
  paths-to-match: /api/v1/**
  default-produces-media-type: application/json
  override-with-generic-response: false
